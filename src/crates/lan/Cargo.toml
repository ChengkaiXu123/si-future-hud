[package]
name = "agent-hud-lan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
base64.workspace = true
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
uuid = { version = "1", features = ["v4"] }
flate2 = "=1.1.10"

[dev-dependencies]
# A throwaway TLS key for the loopback stream test; the same ring rustls uses.
ring = "=0.17.14"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"
core-foundation = "=0.10.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
